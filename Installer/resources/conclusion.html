<h2>Installation Complete</h2>
<p>MatrixScreenSaver has been installed to <strong>/Library/Screen Savers/</strong>.</p>
<p>System Settings will open automatically — select <strong>MatrixScreenSaver</strong> from the Screen Saver list to enable it.</p>
<p style="color: #6e6e73; font-size: 0.88em;">If System Settings doesn't open, go to <strong>System Settings → Screen Saver</strong> and select MatrixScreenSaver.</p>
